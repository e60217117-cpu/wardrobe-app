/* === ИСПРАВЛЕННЫЙ КОНСТРУКТОР (БЕЗ НАЛОЖЕНИЯ) === */
.look-list {
    flex: 1;
    overflow-y: auto !important;
    padding: 10px !important;
    padding-bottom: 150px !important; /* Большой отступ под кнопку "Управление" */
    
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important;

    align-content: start !important;
}

/* === ИСПРАВЛЕННЫЙ КОНСТРУКТОР С НАЗВАНИЯМИ === */
.look-list {
    flex: 1;
    overflow-y: auto !important;
    padding: 10px !important;
    padding-bottom: 150px !important; 
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important; 
    gap: 8px !important; 
    align-content: start !important;
}

.look-item-card {
    /* Используем flex-column, чтобы картинка была сверху, а текст снизу */
    display: flex !important; 
    flex-direction: column !important;
    
    background: #fafafa;
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    
    /* Вместо height: 160px используем min-height, чтобы карточка могла расти */
    width: 100% !important;
    min-height: 180px !important; 
    margin: 0 !important;
    padding: 0 !important;
}

.look-item-card.selected {
    border-color: var(--accent);
    background: #f1f8e9;
}

/* Картинка занимает всё свободное место сверху */
.look-thumb {
    width: 100% !important;
    flex: 1 !important; /* Растягивается на всю доступную высоту */
    object-fit: cover !important;
    display: block !important;
    background: #eee;
    min-height: 130px; /* Минимальная высота картинки, чтобы не сплющилась */
}

/* НОВЫЙ СТИЛЬ ДЛЯ НАЗВАНИЯ ФАЙЛА */
.look-item-name {
    padding: 4px 6px !important;
    font-size: 10px !important; /* Очень мелкий шрифт */

    border-top: 1px solid #eee !important;

    user-select: text !important;

    cursor: text !important; /* Курсор меняется на текстовый при наведении на имя */

.fullscreen-look {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 10px !important;
    overflow-y: auto !important;
    height: 75vh !important; /* Фиксируем высоту области прокрутки */
}

.fullscreen-look-grid {
    display: grid !important;
    /* Адаптивная сетка: минимум 140px, максимум - сколько влезет */
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important; 
    gap: 12px !important;
    padding: 0 !important;
    
    /* ГЛАВНОЕ ИСПРАВЛЕНИЕ: ограничиваем ширину */
    width: 100% !important;
    max-width: 800px !important; /* Чтобы на ПК не было гигантских карточек */
    margin: 0 auto !important;   /* Центрируем */
    
    /* Убираем старые ограничения высоты внутри сетки */
    max-height: none !important; 
    overflow-y: visible !important; /* Прокручивает родитель .fullscreen-look */
}

/* Карточка образа (миниатюра) */
.fullscreen-look-item {
    border-radius: 12px !important;
    overflow: hidden !important;
    position: relative !important;
    cursor: pointer !important;
    background: #f5f5f5 !important;
    border: 2px solid #fff !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08) !important;
    
    /* ЖЕСТКАЯ ФИКСАЦИЯ ПРОПОРЦИЙ */
    width: 100% !important;
    aspect-ratio: 3/4 !important; /* Пропорции как у вещей */
    margin: 0 !important;
}

.fullscreen-look-item img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    display: block !important;
    border-radius: 0 !important;
}

/* Убираем старые стили для одиночного элемента, чтобы не мешали */
.fullscreen-look-grid.single-item {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important;
    max-width: 300px !important; /* Ограничиваем ширину даже для 1 вещи */

const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbySXvxKvKqbs7o9qr_6oPG4QL90TdD4EVGs6oGK_-IVsi4W4mkeG2kDy8L0dJKiyPxzHQ/exec';
class WardrobeCache {
    constructor() { this.data = null; this.isReady = false; }
    hasValidCache() { try { const v = localStorage.getItem(CACHE_CONFIG.KEY_VERSION); const t = localStorage.getItem(CACHE_CONFIG.KEY_SYNC_TIME); if (!v || v !== CACHE_CONFIG.VERSION || !t) return false; return (Date.now() - new Date(t).getTime()) < CACHE_CONFIG.MAX_AGE_HOURS * 3600000; } catch { return false; } }
    loadFromCache() { try { const raw = localStorage.getItem(CACHE_CONFIG.KEY_DATA); if (!raw) return null; this.data = JSON.parse(raw); this.isReady = true; return this.data; } catch { this.clear(); return null; } }
    saveToCache(items) { try { localStorage.setItem(CACHE_CONFIG.KEY_DATA, JSON.stringify(items)); localStorage.setItem(CACHE_CONFIG.KEY_VERSION, CACHE_CONFIG.VERSION); localStorage.setItem(CACHE_CONFIG.KEY_SYNC_TIME, new Date().toISOString()); this.data = items; this.isReady = true; } catch (e) { if (e.name === 'QuotaExceededError') this.clear(); } }
    clear() { localStorage.removeItem(CACHE_CONFIG.KEY_DATA); localStorage.removeItem(CACHE_CONFIG.KEY_VERSION); localStorage.removeItem(CACHE_CONFIG.KEY_SYNC_TIME); this.data = null; this.isReady = false; }
    getSyncTime() { return localStorage.getItem(CACHE_CONFIG.KEY_SYNC_TIME); }
}
const wardrobeCache = new WardrobeCache();

// Глобальные переменные (будут заполнены данными из GAS)

let activeFilters={category:new Set(),type:new Set(),season:new Set(),color:new Set(),status:new Set(),place:new Set(),occasion:new Set(),like:new Set(),often:false,fav:false,notWear:false,search:'',noteSearch:''};

// === ФУНКЦИЯ ЗАГРУЗКИ ДАННЫХ (Универсальная) ===
async function fetchAllItems() {
    showToast('⏳ Загрузка полной базы...');
    
    try {
        let response;
        
        // ОПРЕДЕЛЯЕМ, ГДЕ МЫ ЗАПУЩЕНЫ
        if (typeof google !== 'undefined' && google.script) {
            // === ВАРИАНТ А: Мы внутри Google Apps Script ===
            response = await new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler(resolve)
                    .withFailureHandler(reject)
                    .getWardrobeData();
            });
        } else {
            // === ВАРИАНТ Б: Мы на GitHub Pages (или любом другом хостинге) ===
            const res = await fetch(GAS_WEB_APP_URL + '?action=getWardrobeData');
            if (!res.ok) throw new Error(`Ошибка сети: ${res.status}`);
            response = await res.json();
        }

        // ОБРАБОТКА ОТВЕТА (одинаковая для обоих вариантов)
        if (response.error) {
            showToast(' ' + response.error);
            return [];
        }

        // Заполняем глобальные справочники
        tagNames = response.tagNames || {}; typeNames = response.typeNames || {};
        catNames = response.catNames || {}; placeNames = response.placeNames || {};
        colorNames = response.colorNames || {}; statusNames = response.statusNames || {};
        seasonsItemList = response.seasonsItemList || []; occasionsItemList = response.occasionsItemList || [];
        occasionsLookList = response.occasionsLookList || []; seasonsLookList = response.seasonsLookList || [];
        likesList = response.likesList || [];

        const adaptedItems = response.items || [];

        // Объединяем локальные и DB образы
        if (response.savedLooks && response.savedLooks.length > 0) {
            const localIds = new Set(savedLooks.map(l=>l.uniqueId));
            response.savedLooks.forEach(dl => { if(!localIds.has(dl.uniqueId)) savedLooks.push(dl); });
        }

        return adaptedItems;

    } catch (e) {
        console.error(e);
        showToast('❌ Ошибка загрузки данных: ' + e.message);
        return [];
    }
}

async function initAppWithCache() {
    try {

        {label:'Цвет', key:'color',

function getSortedTypeIds() {
    const typeEntries = Object.entries(typeNames);
    // Сначала ищем "Другое" (T_31)
    const otherEntry = typeEntries.find(([id]) => id === 'T_31');
    // Остальные сортируем по названию (алфавит)
    const otherTypes = typeEntries.filter(([id]) => id !== 'T_31').sort((a, b) => a[1].localeCompare(b[1]));
    // Собираем: [Другое] + [остальные по алфавиту]
    const sorted = otherEntry ? [otherEntry, ...otherTypes] : otherTypes;
    return sorted.map(([id]) => id);
}

function render(items){
    const g=document.getElementById('gallery');
    g.innerHTML='';
    if(!items.length){
        g.innerHTML='<p style="text-align:center;width:100%;color:#999;grid-column:1/-1;padding:40px">Пусто</p>';
        return
    }
    items.forEach(it=>{
        const c=document.createElement('div');
        c.className='card'+(selectedNames.has(it.name)?' selected':'');
        c.dataset.name=it.name;
        c.onclick = (e) => {
            if(!e.target.classList.contains('card-check')) {
                toggleSelect(it.name);
            }
        };
        c.innerHTML=`
            <div class="card-check" onclick="event.stopPropagation();toggleSelect('${it.name}')">✓</div>
            <div class="card-img-wrap">
                ${it.image ? `<img src="${it.image}" loading="lazy">` : ''}
            </div>
            <div class="card-info">
                <div class="card-name">${it.name}</div>
            </div>`;
        g.appendChild(c)
    })
}

function applyFilters(){
    let f=data;
    Object.keys(activeFilters).forEach(k=>{
        if(k==='search'||k==='often'||k==='fav')return;
        const s=activeFilters[k];
        if(s instanceof Set&&s.size>0){
            const a=Array.from(s);
            if(['season','occasion','like'].includes(k))f=f.filter(i=>a.some(t=>i.tags.includes(t)));
            else f=f.filter(i=>a.includes(i[k]))
        }
    });
    if(activeFilters.often)f=f.filter(i=>i.tags.includes('LIKE_OFTEN'));
    if(activeFilters.fav)f=f.filter(i=>i.tags.includes('LIKE_FAV'));
    // === НОВЫЙ ФИЛЬТР "НЕ НОШУ" ===
if(activeFilters.notWear)f=f.filter(i=>i.tags.includes('NOT_WEAR'));
// ==============================
    if(activeFilters.search)f=f.filter(i=>i.name.toLowerCase().includes(activeFilters.search));

// === ФИЛЬТР ПО ЗАМЕТКАМ ===
if (activeFilters.noteSearch) {
    const query = activeFilters.noteSearch;
    f = f.filter(item => 
        item.tags.some(tag => tag.startsWith('NOTE_') && tag.substring(5).toLowerCase().includes(query))
    );
}
// ========================

filteredItemsCache=f;
render(f)
}

function buildGridHtml(items){ 
    const isSingle = items.length === 1; 
    let gh = ''; 
    
    items.forEach(it => { 
        let itemName = "";
        if (typeof it === 'object' && it !== null) {
            itemName = it.name || it.Name_File || ""; 
        } else {
            itemName = String(it);
        }
        const foundItem = data.find(x => x.name.trim() === itemName.trim());
        const img = foundItem ? foundItem.image : ''; 
        gh += `<div class="fullscreen-look-item"><img src="${img}" loading="lazy"></div>` 
    }); 
    return `<div class="fullscreen-look-grid${isSingle?' single-item':''}">${gh}</div>` 
}

function copyLookComposition(idx){ 
    const look = savedLooks[idx]; 
    let names = []; 
    if(Array.isArray(look.items)) { names = look.items.map(i => typeof i === 'string' ? i : i.name); } 
    else if(typeof look.items === 'string') { try { names = JSON.parse(look.items); } catch(e) { names = [look.items]; } } 
    safeCopy(names.join(',')); 
    showToast('📋 Состав (через запятую)'); 
    document.querySelectorAll('.looks-actions-menu-inline').forEach(m=>m.classList.remove('open')); 
}

function extractNames(items) { 
    if (!items) return []; 
    if (typeof items === 'string') { 
        try { items = JSON.parse(items); } catch(e) { return [items]; } 
    } 
    if (!Array.isArray(items)) return []; 
    return items.map(i => typeof i === 'string' ? i : (i.name || '')); 
}

async function generateLookHash(items) { 
    const names = extractNames(items); 
    const sorted = [...names].sort((a, b) => a.localeCompare(b)); 
    const key = sorted.join(','); 
    let hash = 0; 
    for (let i = 0; i < key.length; i++) { 
        const char = key.charCodeAt(i); 
        hash = ((hash << 5) - hash) + char; 
        hash = hash & hash; 
    } 
    return Math.abs(hash).toString(16); 
}

function findDuplicateLook(items) { 
    const names = extractNames(items); 
    const sorted = [...names].sort((a, b) => a.localeCompare(b)); 
    const key = sorted.join(','); 
    return savedLooks.find(look => { 
        const lookNames = extractNames(look.items); 
        const lookSorted = [...lookNames].sort((a,b)=>a.localeCompare(b)); 
        return lookSorted.join(',') === key; 
    }); 
}

function getUniqueName(baseName) { 
    let name = baseName; let counter = 2; 
    while (savedLooks.some(l => l.name === name)) { name = `${baseName}_${counter}`; counter++; } 
    return name; 
}

function generateSmartName(items) { 
    const names = extractNames(items); 
    if (!names || names.length === 0) return `Образ_${new Date().toLocaleDateString()}`; 
    const shortName = names[0].split('_')[0].substring(0, 10); 
    const dateStr = new Date().toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'}); 
    return getUniqueName(`${shortName}_${dateStr}`); 
}

function toggleSubmenu(id, btnEl){ 
    const submenu = document.getElementById(id); 
    if(submenu.classList.contains('open')){ 
        submenu.classList.remove('open'); submenu.classList.remove('open-left'); 
        submenu.querySelectorAll('.subsub').forEach(s => { s.classList.remove('open'); s.classList.remove('open-left'); }); 
        return; 
    } 
    document.querySelectorAll('.submenu').forEach(s=>{ if(s.id !== id){ s.classList.remove('open'); s.classList.remove('open-left'); }}); 
    document.querySelectorAll('.subsub').forEach(s=>{ s.classList.remove('open'); s.classList.remove('open-left'); }); 
    const rect = btnEl.getBoundingClientRect(); 
    if(rect.right + 220 + 16 > window.innerWidth){ submenu.classList.add('open-left'); } 
    submenu.classList.add('open'); 
}
function toggleSubSub(id, btnEl){ 
    document.querySelectorAll('.subsub').forEach(s=>{if(s.id!==id){s.classList.remove('open');s.classList.remove('open-left')}}); 
    const subsub = document.getElementById(id); 
    const isOpening = !subsub.classList.contains('open'); 
    if(isOpening && btnEl.getBoundingClientRect().right + 180 + 16 > window.innerWidth){ subsub.classList.add('open-left'); } 
    subsub.classList.toggle('open'); 
}
function updateManageBar(){ 
    const bar = document.getElementById('lookManageBar'); 
    if(selectedLookIndex >= 0 && lookItems.length > 0){ bar.classList.add('visible'); } 
    else { bar.classList.remove('visible'); closeManageMenu(); } 
}
function renderLookList(){ 
    const l = document.getElementById('lookList');
    const u = document.getElementById('moveUpBtn');
    const d = document.getElementById('moveDownBtn'); 
    
    if(!lookItems.length){ 
        l.innerHTML = '<div class="look-empty">Пусто. Выберите вещи в галерее</div>'; 
        u.disabled = true;
        d.disabled = true;
        selectedLookIndex = -1;
        return; 
    } 
    
    u.disabled = selectedLookIndex <= 0; 
    d.disabled = selectedLookIndex >= lookItems.length - 1; 
    l.innerHTML = ''; 
    
    lookItems.forEach((it, i) => { 
        const el = document.createElement('div'); 
        el.className = 'look-item-card' + (i === selectedLookIndex ? ' selected' : ''); 
        
        // Клик по карточке выбирает её, но клик по тексту названия - нет (чтобы можно было выделять)
        el.onclick = (e) => {
            if (!e.target.classList.contains('look-item-name')) {
                selectLookItem(i);
            }
        };
        
        // Добавляем название файла под картинкой
        el.innerHTML = `
            <img class="look-thumb" src="${it.image}" loading="lazy">
            <div class="look-item-name" title="${it.name}">${it.name}</div>
            <button class="look-remove" onclick="event.stopPropagation();removeFromLook(${i})">✕</button>
        `; 
        
        l.appendChild(el); 
    }); 
}

// 2. Функция для НИЖНЕЙ кнопки "В лук" (только добавление без открытия)
function addToLookSilent() {
    if (selectedNames.size === 0) {
        showToast('⚠️ Сначала выберите вещи');
        return;
    }
    
    let addedCount = 0;
    selectedNames.forEach(n => {
        if (!lookItems.find(i => i.name === n)) {
            const d = data.find(x => x.name === n);
            lookItems.push({
                name: n, 
                image: d?.image || '', 
                tempFav: d?.tags.includes('LIKE_FAV'), 
                tempStatus: d?.status || 'ST_OK'
            });
            addedCount++;
        }
    });
    
    if (addedCount > 0) {
        saveLook();
        showToast(`✅ +${addedCount} вещ. в лук`);
        // Обновляем список в фоне, чтобы при открытии всё было актуально
        renderLookList();
        updateManageBar();
    } else {
        showToast('ℹ️ Все выбранные вещи уже в луке');
    }
    
    // Снимаем выделение после добавления (опционально)
    clearSelection();
}

async function sendLookToDb(idx){ 
    const look = savedLooks[idx]; 
    const names = extractNames(look.items); 
    const hash = look.uniqueId || await generateLookHash(names); 
    if (window.Telegram && window.Telegram.WebApp) { 
        window.Telegram.WebApp.sendData(JSON.stringify({ action: 'save_look', name: look.name, items: names, hash: hash })); 
        showToast('✅ Данные отправлены боту невидимо!'); 
    } else { 
        const cmd = `/save_look ${look.name} ${names.join(',')}`; 
        await safeCopy(cmd); 
        showToast('📋 Команда скопирована! Вставь в чат с ботом.'); 
    } 
    document.querySelectorAll('.looks-actions-menu-inline').forEach(m=>m.classList.remove('open')); 
}
async function exportLooksToTable() { 
    if(savedLooks.length === 0) { showToast('⚠️ Нет образов для экспорта'); return; } 
    let csvContent = "Look_ID,Name,Items_JSON,Source\n"; 
    for (const look of savedLooks) { 
        let hash = look.uniqueId || await generateLookHash(look.items); 
        const name = `"${(look.name || '').replace(/"/g, '""')}"`; 
        const itemsJson = `"${JSON.stringify(extractNames(look.items)).replace(/"/g, '""')}"`; 
        const source = look.source || 'local'; 
        csvContent += `${hash},${name},${itemsJson},${source}\n`; 
    } 
    await safeCopy(csvContent); 
    showToast(`📋 Скопировано ${savedLooks.length} образов! Вставь в Google Таблицу.`); 
    document.querySelectorAll('.looks-actions-menu-inline').forEach(m=>m.classList.remove('open')); 
}

// === ГЛАВНАЯ ФУНКЦИЯ СОХРАНЕНИЯ ОБРАЗА ===
async function confirmSaveLook(isDuplicateAllowed = false) {
    const name = document.getElementById('saveDialogName').value;
    const uniqueId = document.getElementById('saveDialogHash').value;
    const fav = document.getElementById('saveDialogFav').checked;
    const often = document.getElementById('saveDialogOften').checked;
    
    // Проверяем дубликат только если НЕ разрешено сохранять копию
    if (!isDuplicateAllowed) {
        const dup = findDuplicateLook(lookItems);
        if (dup) {
            window._pendingDuplicateName = dup.name;
            document.getElementById('duplicateLookText').textContent = 
                `Образ "${dup.name}" уже существует. Вы уверены, что хотите сохранить копию?`;
            document.getElementById('duplicateLookOverlay').classList.add('open');
            return; // Прерываем выполнение, ждем ответа пользователя
        }
    }

    // === ЛОГИКА СОХРАНЕНИЯ (выполняется всегда, если дошли сюда) ===
    const newTags = [];
    if(fav) newTags.push('OLIKE_FAV');
    if(often) newTags.push('OLIKE_OFTEN');
    
    // Собираем множественные значения из чекбоксов (если они есть в HTML)
    const selectedOccasions = Array.from(document.querySelectorAll('#saveOccasionGroup input:checked')).map(cb => cb.value);
    const selectedSeasons = Array.from(document.querySelectorAll('#saveSeasonGroup input:checked')).map(cb => cb.value);
    const selectedLikes = Array.from(document.querySelectorAll('.like-btn input:checked')).map(cb => cb.value);
    
    newTags.push(...selectedOccasions);
    newTags.push(...selectedSeasons);
    newTags.push(...selectedLikes);

    savedLooks.push({
        name, items:[...lookItems], 
        occasion: selectedOccasions.join(','), 
        season: selectedSeasons.join(','),
        fav, often,
        date:new Date().toLocaleDateString(), source: 'local', uniqueId, tags: newTags
    });
    
    const names = getCurrentLookNames();
    const s = JSON.stringify([...names].sort());
    
    if(document.getElementById('saveDialogPlanTomorrow').checked && !plans.tomorrow.some(p => JSON.stringify(p.items.sort()) === s))
        plans.tomorrow.push({items:[...names], occasion:selectedOccasions.join(','), season:selectedSeasons.join(',')});
    if(document.getElementById('saveDialogPlanDayAfter').checked && !plans.dayafter.some(p => JSON.stringify(p.items.sort()) === s))
        plans.dayafter.push({items:[...names], occasion:selectedOccasions.join(','), season:selectedSeasons.join(',')});
    if(document.getElementById('saveDialogPlanDay3').checked && !plans.day3.some(p => JSON.stringify(p.items.sort()) === s))
        plans.day3.push({items:[...names], occasion:selectedOccasions.join(','), season:selectedSeasons.join(',')});
        
    savePlans();
    try { localStorage.setItem('saved_looks', JSON.stringify(savedLooks)); } catch(e) {}
    closeSaveDialog();
    showToast(`💾 "${name}" сохранён`);
    renderLooksFullscreen();
} // <--- ВОТ ЭТОЙ СКОБКИ НЕ ХВАТАЛО! Она закрывает confirmSaveLook

function getDedupedPlanItems(day){ 
    const items=plans[day]||[];const seen=new Set();const result=[]; 
    items.forEach(plan=>{const uniqueItems=plan.items.filter(name=>{if(seen.has(name))return false;seen.add(name);return true});if(uniqueItems.length>0)result.push({...plan,items:uniqueItems,originalItems:plan.items})}); 
    return result 
}
function renderPlanFullscreen(){ 
    const c=document.getElementById('planFullscreen'),counter=document.getElementById('planCounter'); 
    const deduped=getDedupedPlanItems(currentPlanDay); 
    if(!deduped.length){c.innerHTML='<div class="fullscreen-empty">Ничего не запланировано</div>';counter.textContent='';return} 
    if(planSlideIndex>=deduped.length)planSlideIndex=deduped.length-1;if(planSlideIndex<0)planSlideIndex=0; 
    const plan=deduped[planSlideIndex];let gh=''; 
    plan.items.forEach(name=>{const d=data.find(x=>x.name===name);const img=d?d.image:'';gh+=`<div class="plan-item" style="position:relative"><button class="plan-item-remove" onclick="removeItemFromPlan('${currentPlanDay}',${planSlideIndex},'${name.replace(/'/g,"\\'")}')" title="Удалить вещь">✕</button><img src="${img}" loading="lazy"></div>`}); 
    c.innerHTML=`<div class="plan-grid${plan.items.length===1?' single-item':''}">${gh}</div>`; 
    counter.textContent=`${planSlideIndex+1} / ${deduped.length}` 
}

async function addLookToDatabaseDirect(idx) {
    const look = savedLooks[idx];
    if (!look) { showToast('⚠️ Образ не найден'); return; }
    
    showToast('⏳ Сохраняю в таблицу...');
    
    try {
        // Вызываем серверную функцию
        google.script.run
            .withSuccessHandler(function(response) {
                if (response.error) {
                    showToast('❌ Ошибка: ' + response.error);
                } else {
                    if (response.alreadyExists) {
                        showToast('ℹ️ Такой образ уже есть в таблице');
                    } else {
                        showToast('✅ Образ сохранен в таблицу!');
                    }

                document.querySelectorAll('.looks-actions-menu-inline').forEach(m => m.classList.remove('open'));

            .withFailureHandler(function(err) {
                console.error("Ошибка GAS:", err);
                showToast('❌ Ошибка соединения с сервером');
                document.querySelectorAll('.looks-actions-menu-inline').forEach(m => m.classList.remove('open'));
            })
            .addLookToDatabase({
                uniqueId: look.uniqueId,
                name: look.name,
                items: look.items, // Отправляем как есть, сервер сам очистит
                tags: look.tags || [],
                source: 'local_direct'
            });

    } catch (e) {
        console.error(e);
        showToast('❌ Неожиданная ошибка');
    }

    const groups = [

    ];

    groups.forEach(group => {

        const section = document.createElement('div');
        section.className = 'edit-tags-section';
        section.innerHTML = `<div class="edit-tags-title">${group.title}</div><div class="edit-tags-grid"></div>`;
        
        const grid = section.querySelector('.edit-tags-grid');
        
        group.items.forEach(item => {
            const isLiked = item.id === 'OLIKE_YES';
            const isDisliked = item.id === 'ODISLIKE_NO';
            const isChecked = look.tags && look.tags.includes(item.id);
            
            const label = document.createElement('label');
            label.className = 'edit-tag-checkbox' + (isChecked ? ' checked' : '');
            label.dataset.id = item.id;
            
            label.onclick = () => {
                const input = label.querySelector('input');
                
                // Логика взаимоисключения для Нравится/Не нравится
                if (isLiked || isDisliked) {
                    if (isLiked && !input.checked) {
                        const disLabel = grid.querySelector(`[data-id="ODISLIKE_NO"]`);
                        if(disLabel) { disLabel.classList.remove('checked'); disLabel.querySelector('input').checked = false; }
                    }
                    if (isDisliked && !input.checked) {
                        const likeLabel = grid.querySelector(`[data-id="OLIKE_YES"]`);
                        if(likeLabel) { likeLabel.classList.remove('checked'); likeLabel.querySelector('input').checked = false; }
                    }
                }
                
                input.checked = !input.checked;
                label.classList.toggle('checked', input.checked);
            };

            label.innerHTML = `
                <input type="checkbox" value="${item.id}" ${isChecked ? 'checked' : ''}>
                <span class="check-icon">✓</span>

function createCheckboxSection(title, items, currentTags, isExclusive=false) {
    const section = document.createElement('div');
    section.className = 'edit-item-section';
    section.innerHTML = `<div class="edit-item-title">${title}</div><div class="edit-item-grid"></div>`;
    const grid = section.querySelector('.edit-item-grid');
    
    items.forEach(item => {
        const isChecked = currentTags.includes(item.id);
        const label = document.createElement('label');
        label.className = 'edit-tag-checkbox' + (isChecked ? ' checked' : '');
        
        label.onclick = () => {
            const input = label.querySelector('input');
            
            if (isExclusive) {
                // Логика взаимоисключения
                if (item.id === 'LIKE_YES' && !input.checked) {
                    const disLabel = grid.querySelector('[data-id="DISLIKE_NO"]');
                    if(disLabel) { disLabel.classList.remove('checked'); disLabel.querySelector('input').checked = false; }
                }
                if (item.id === 'DISLIKE_NO' && !input.checked) {
                    const likeLabel = grid.querySelector('[data-id="LIKE_YES"]');
                    if(likeLabel) { likeLabel.classList.remove('checked'); likeLabel.querySelector('input').checked = false; }
                }
            }
            
            input.checked = !input.checked;
            label.classList.toggle('checked', input.checked);
            
            // Обновляем состояние тегов
            if (input.checked) {
                if (!editItemState.tags.includes(item.id)) editItemState.tags.push(item.id);
            } else {
                editItemState.tags = editItemState.tags.filter(t => t !== item.id);
            }
        };
        
        label.dataset.id = item.id;
        label.innerHTML = `
            <input type="checkbox" value="${item.id}" ${isChecked ? 'checked' : ''}>
            <span class="check-icon">✓</span>
            <span>${item.name}</span>
        `;
        grid.appendChild(label);
    });
    
    return section;
}

function createRadioSection(title, options, currentValue, stateKey) {
    const section = document.createElement('div');
    section.className = 'edit-item-section';
    section.innerHTML = `<div class="edit-item-title">${title}</div><div class="edit-item-grid"></div>`;
    const grid = section.querySelector('.edit-item-grid');
    
    options.forEach(opt => {
        const isSelected = currentValue === opt.id;
        const label = document.createElement('label');
        label.className = 'edit-item-radio' + (isSelected ? ' selected' : '');
        
        label.onclick = () => {
            // Снимаем выделение со всех радио в этой группе
            grid.querySelectorAll('.edit-item-radio').forEach(r => r.classList.remove('selected'));
            label.classList.add('selected');
            label.querySelector('input').checked = true;
            
            // Обновляем состояние
            editItemState[stateKey] = opt.id;
            validateEditItemForm();
        };
        
        label.innerHTML = `
            <input type="radio" name="${stateKey}" value="${opt.id}" ${isSelected ? 'checked' : ''}>
            <span class="radio-icon"></span>
            <span>${opt.name}</span>
        `;
        grid.appendChild(label);
    });
    
    return section;
}

async function saveEditedItem() {
    if (!currentEditItemName) return;
    if (!editItemState.status || !editItemState.place) {
        showToast('⚠️ Выберите статус и место!');
        return;
    }
    
    const saveBtn = document.getElementById('editItemSaveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Сохраняю...';
    
    try {
        // === ОБРАБОТКА КОММЕНТАРИЯ ПЕРЕД СОХРАНЕНИЕМ ===
        const commentInput = document.getElementById('itemCommentInput');
        const commentText = commentInput ? commentInput.value.trim() : '';
        
        // Удаляем старый комментарий
        editItemState.tags = editItemState.tags.filter(t => !t.startsWith('NOTE_'));
        
        // Добавляем новый, если есть текст
        if (commentText) {
            editItemState.tags.push('NOTE_' + commentText);
        }
        // ==============================================

        const res = await new Promise((resolve, reject) => {
            google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                .updateItemDetailsDirect(
                    currentEditItemName, 
                    editItemState.status, 
                    editItemState.place, 
                    editItemState.tags
                );
        });

        if (res.error) {
            showToast('❌ ' + res.error);
        } else {
            // 1. Обновляем локальные данные вещи
            const item = data.find(i => i.name === currentEditItemName);
            if (item) {
                item.status = res.status;
                item.place = res.place;
                item.tags = res.tags; // Теперь здесь гарантированно актуальные теги с сервера
            }
            
            // 2. ВАЖНО: Очищаем кэш, чтобы при следующем открытии взялись свежие данные
            wardrobeCache.clear();
            
            // 3. Перерисовываем интерфейс
            applyFilters(); 
            showCurrentModalItem(); 
            
            showToast('✅ Вещь обновлена!');
        }
    } catch (err) {
        console.error("Ошибка сохранения:", err);
        showToast(' Ошибка соединения с таблицей');
    } finally {
        // ВСЕГДА закрываем окно и разблокируем кнопку
        closeEditItemModal();
        saveBtn.disabled = false;
        saveBtn.textContent = 'Сохранить';
    }
}

function executeUniversalAction() {
    const action = document.getElementById('universalConfirmAction').value;
    const idx = parseInt(document.getElementById('universalConfirmIdx').value);
    
    // 1. Очистка конструктора
    if (action === 'clearLook') {
        lookItems = []; selectedLookIndex = -1; saveLook(); renderLookList(); updateManageBar();
        showToast('🗑️ Конструктор очищен');
    }
    // 2. Очистка всех планов
    else if (action === 'clearAllPlans') {
        plans = { tomorrow: [], dayafter: [], day3: [] }; savePlans(); planSlideIndex = 0; renderPlanFullscreen();
        showToast('🗑️ Все планы очищены');
    }
    // 3. Очистка дня
    else if (action === 'clearPlanDay') {
        plans[currentPlanDay] = []; savePlans(); planSlideIndex = 0; renderPlanFullscreen();
        showToast('🗑️ День очищен');
        document.getElementById('planManageMenu').classList.remove('open');
    }
    // 4. Удаление локального образа (НОВОЕ!)
    else if (action === 'deleteLocalLook') {
        const look = savedLooks[idx];
        savedLooks.splice(idx, 1);
        try { localStorage.setItem('saved_looks', JSON.stringify(savedLooks)); } catch(e) {}
        
        if (looksSlideIndex >= getFilteredLooks().length) {
            looksSlideIndex = Math.max(0, getFilteredLooks().length - 1);
        }
        renderLooksFullscreen();
        showToast(`️ "${look.name}" удалён`);
    }
    // 5. Удаление из базы данных (НОВОЕ!)
    else if (action === 'deleteDbLook') {
        const look = savedLooks[idx];
        showToast('🗑️ Удаляю из таблицы...');
        
        google.script.run
            .withSuccessHandler(function(response) {
                if (response.error) {
                    showToast('❌ Ошибка: ' + response.error);
                } else {
                    showToast('✅ Образ удален из таблицы!');
                    // Удаляем и локально тоже, чтобы не висел "призрак"
                    savedLooks.splice(idx, 1);
                    localStorage.setItem('saved_looks', JSON.stringify(savedLooks));
                    renderLooksFullscreen();
                }
                closeUniversalConfirm();
            })
            .withFailureHandler(function(err) {
                showToast('❌ Ошибка соединения');
                closeUniversalConfirm();
            })
            .removeLookFromDatabase(look.uniqueId);
            
        // Не закрываем окно сразу, ждем ответа сервера
        return; 
    }
    // 6. Копирование команды удаления для Бота (НОВОЕ!)
    else if (action === 'copyBotDeleteCmd') {
        const look = savedLooks[idx];
        const cmd = `/delete_look ${look.uniqueId}`;
        
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.sendData(JSON.stringify({ action: 'delete_look', id: look.uniqueId }));
            showToast('✅ Команда удаления отправлена боту!');
        } else {
            safeCopy(cmd).then(() => {
                showToast('📋 Команда скопирована! Вставь в чат с ботом.');
            });
        }
        document.querySelectorAll('.looks-actions-menu-inline').forEach(m => m.classList.remove('open'));
    }
    
    closeUniversalConfirm();
}
let currentEditItemName = null;
let editItemState = { status: '', place: '', tags: [] };

function openEditItemModal() {
    if (currentModalIndex === -1 || !filteredItemsCache[currentModalIndex]) return;
    
    const item = filteredItemsCache[currentModalIndex];
    currentEditItemName = item.name;
    
    // Инициализируем состояние текущими данными
    editItemState = {
        status: item.status || '',
        place: item.place || '',
        tags: [...(item.tags || [])]
    };
    
    renderEditItemForm();
    document.getElementById('editItemOverlay').classList.add('open');
}



function createCheckboxSection(title, items, currentTags, isExclusive=false) {
    const section = document.createElement('div');
    section.className = 'edit-item-section';
    section.innerHTML = `<div class="edit-item-title">${title}</div><div class="edit-item-grid"></div>`;
    const grid = section.querySelector('.edit-item-grid');
    
    items.forEach(item => {
        const isChecked = currentTags.includes(item.id);
        const label = document.createElement('label');
        label.className = 'edit-tag-checkbox' + (isChecked ? ' checked' : '');
        
        label.onclick = () => {
            const input = label.querySelector('input');
            
            if (isExclusive) {
                // Логика взаимоисключения
                if (item.id === 'LIKE_YES' && !input.checked) {
                    const disLabel = grid.querySelector('[data-id="DISLIKE_NO"]');
                    if(disLabel) { disLabel.classList.remove('checked'); disLabel.querySelector('input').checked = false; }
                }
                if (item.id === 'DISLIKE_NO' && !input.checked) {
                    const likeLabel = grid.querySelector('[data-id="LIKE_YES"]');
                    if(likeLabel) { likeLabel.classList.remove('checked'); likeLabel.querySelector('input').checked = false; }
                }
            }
            
            input.checked = !input.checked;
            label.classList.toggle('checked', input.checked);
            
            // Обновляем состояние тегов
            if (input.checked) {
                if (!editItemState.tags.includes(item.id)) editItemState.tags.push(item.id);
            } else {
                editItemState.tags = editItemState.tags.filter(t => t !== item.id);
            }
        };
        
        label.dataset.id = item.id;
        label.innerHTML = `
            <input type="checkbox" value="${item.id}" ${isChecked ? 'checked' : ''}>
            <span class="check-icon">✓</span>
            <span>${item.name}</span>
        `;
        grid.appendChild(label);
    });
    
    return section;
}

function createRadioSection(title, options, currentValue, stateKey) {
    const section = document.createElement('div');
    section.className = 'edit-item-section';
    section.innerHTML = `<div class="edit-item-title">${title}</div><div class="edit-item-grid"></div>`;
    const grid = section.querySelector('.edit-item-grid');
    
    options.forEach(opt => {
        const isSelected = currentValue === opt.id;
        const label = document.createElement('label');
        label.className = 'edit-item-radio' + (isSelected ? ' selected' : '');
        
        label.onclick = () => {
            // Снимаем выделение со всех радио в этой группе
            grid.querySelectorAll('.edit-item-radio').forEach(r => r.classList.remove('selected'));
            label.classList.add('selected');
            label.querySelector('input').checked = true;
            
            // Обновляем состояние
            editItemState[stateKey] = opt.id;
            validateEditItemForm();
        };
        
        label.innerHTML = `
            <input type="radio" name="${stateKey}" value="${opt.id}" ${isSelected ? 'checked' : ''}>
            <span class="radio-icon"></span>
            <span>${opt.name}</span>
        `;
        grid.appendChild(label);
    });
    
    return section;
}

function validateEditItemForm() {
    const btn = document.getElementById('editItemSaveBtn');
    const isValid = editItemState.status && editItemState.place;
    btn.disabled = !isValid;
}

function closeEditItemModal() {
    document.getElementById('editItemOverlay').classList.remove('open');
    currentEditItemName = null;
}

async function saveEditedItem() {
    if (!currentEditItemName) return;
    if (!editItemState.status || !editItemState.place) {
        showToast('️ Выберите статус и место!');
        return;
    }
    
    const saveBtn = document.getElementById('editItemSaveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Сохраняю...';
    
    try {
        // === ОБРАБОТКА КОММЕНТАРИЯ ПЕРЕД СОХРАНЕНИЕМ ===
        const commentInput = document.getElementById('itemCommentInput');
        const commentText = commentInput ? commentInput.value.trim() : '';
        
        // Удаляем старый комментарий из массива тегов
        editItemState.tags = editItemState.tags.filter(t => !t.startsWith('NOTE_'));
        
        // Добавляем новый, если поле не пустое
        if (commentText) {
            editItemState.tags.push('NOTE_' + commentText);
        }
        // ==============================================

        const res = await new Promise((resolve, reject) => {
            google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                .updateItemDetailsDirect(
                    currentEditItemName, 
                    editItemState.status, 
                    editItemState.place, 
                    editItemState.tags // Сюда передается обновленный массив с NOTE_
                );
        });

        if (res.error) {
            showToast('❌ ' + res.error);
        } else {
            // Обновляем локальные данные вещи
            const item = data.find(i => i.name === currentEditItemName);
            if (item) {
                item.status = res.status;
                item.place = res.place;
                item.tags = res.tags;
            }
            
            // Очищаем кэш для корректного отображения при следующем открытии
            wardrobeCache.clear();
            
            // Перерисовываем интерфейс
            applyFilters(); 
            showCurrentModalItem(); 
            
            showToast('✅ Вещь обновлена!');
        }
    } catch (err) {
        console.error("Ошибка сохранения:", err);
        showToast(' Ошибка соединения с таблицей');
    } finally {
        closeEditItemModal();
        saveBtn.disabled = false;
        saveBtn.textContent = 'Сохранить';
    }
}
// === ПОИСК ОБРАЗОВ ПО СОСТАВУ ===
let lookItemSearchQuery = '';

document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('lookItemSearchInput');
    if (input) {
        input.addEventListener('input', (e) => {
            lookItemSearchQuery = e.target.value.toLowerCase().trim();
            looksSlideIndex = 0; // Сброс на первый образ при поиске
            renderLooksFullscreen();
        });
    }
});

// Модифицируем функцию getFilteredLooks, чтобы она учитывала новый поиск
const originalGetFilteredLooks = getFilteredLooks;
getFilteredLooks = function() {
    let f = originalGetFilteredLooks(); // Получаем уже отфильтрованный по тегам список
    
    if (lookItemSearchQuery) {
        f = f.filter(look => {
            // Извлекаем имена вещей из образа
            const names = extractNames(look.items);
            // Проверяем, содержит ли какое-либо имя поисковый запрос
            return names.some(name => name.toLowerCase().includes(lookItemSearchQuery));
        });
    }
    return f;
};
